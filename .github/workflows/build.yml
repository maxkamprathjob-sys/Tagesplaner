name: Build & Tests

# Läuft bei jedem Push auf einem macOS-Server von GitHub mit Xcode.
# Ergebnis: Kernlogik-Tests, App-Tests im iOS-Simulator und ein
# vollständiger (unsignierter) Gerätebuild inkl. Widgets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUNDLE_ID_PREFIX: de.tagesplaner.ci
      DEVELOPMENT_TEAM: ""
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Kernlogik testen (PlannerCore)
        run: swift test --package-path Packages/PlannerCore 2>&1 | tee core-tests.log

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App-Tests im Simulator
        run: |
          set -o pipefail
          UDID=$(ci/pick-simulator.sh)
          xcodebuild test \
            -project Tagesplaner.xcodeproj \
            -scheme Tagesplaner \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee app-tests.log | grep -E "error:|warning: .*(deprecated|unused)|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" app-tests.log
          echo "$UDID" > sim-udid.txt

      - name: Screenshots im Simulator
        continue-on-error: true
        run: |
          UDID=$(cat sim-udid.txt)
          APP=$(find DerivedData/Build/Products -name "Tagesplaner.app" -path "*iphonesimulator*" | head -1)
          mkdir -p screenshots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl launch "$UDID" "$BUNDLE" -screenshotDemo
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshots/plan-dark.png
          xcrun simctl terminate "$UDID" "$BUNDLE"
          xcrun simctl launch "$UDID" "$BUNDLE" -screenshotDemo -tasksTab
          sleep 6
          xcrun simctl io "$UDID" screenshot screenshots/tasks-dark.png
          xcrun simctl terminate "$UDID" "$BUNDLE"
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl launch "$UDID" "$BUNDLE" -screenshotDemo
          sleep 6
          xcrun simctl io "$UDID" screenshot screenshots/plan-light.png

      - name: Gerätebuild (ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tagesplaner.xcodeproj \
            -scheme Tagesplaner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee device-build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" device-build.log

      - name: Fehlerübersicht
        if: failure()
        run: |
          for f in core-tests.log app-tests.log device-build.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -nE "error:|failed|FAILED|fatal" "$f" | head -150 || true
          done

      - name: Logs in Branch ci-logs ablegen
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          cp *.log /tmp/ci-logs/ 2>/dev/null || true
          cp -r screenshots /tmp/ci-logs/ 2>/dev/null || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} status=${{ job.status }}" > /tmp/ci-logs/STATUS
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Logs für ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
