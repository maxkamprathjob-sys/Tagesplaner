# Projektbeschreibung für XcodeGen. Das .xcodeproj wird daraus erzeugt
# (lokal auf einem Mac oder automatisch in GitHub Actions) und nicht eingecheckt.
#
# Benötigte Umgebungsvariablen beim Erzeugen:
#   BUNDLE_ID_PREFIX  z. B. de.maxkamprath   (muss weltweit eindeutig sein)
#   DEVELOPMENT_TEAM  Apple-Team-ID (10 Zeichen), für Simulator-Builds leer lassen
name: Tagesplaner

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    BUNDLE_ID_PREFIX: "${BUNDLE_ID_PREFIX}"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  PlannerCore:
    path: Packages/PlannerCore

targets:
  Tagesplaner:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: PlannerCore
      - target: TagesplanerWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tagesplaner
        PRODUCT_NAME: Tagesplaner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Tagesplaner
    entitlements:
      path: App/Tagesplaner.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).tagesplaner
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tagesplaner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        LSRequiresIPhoneOS: true
        AppGroupIdentifier: group.$(BUNDLE_ID_PREFIX).tagesplaner
        NSCalendarsFullAccessUsageDescription: Damit deine Apple-Kalendertermine im Tagesplan angezeigt und bei der Planung berücksichtigt werden. Die App verändert deinen Kalender nicht.
        NSCalendarsUsageDescription: Damit deine Apple-Kalendertermine im Tagesplan angezeigt werden.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: tagesplaner
            CFBundleURLSchemes:
              - tagesplaner

  TagesplanerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tagesplaner.widgets
        PRODUCT_NAME: TagesplanerWidgets
        SKIP_INSTALL: YES
    entitlements:
      path: Widgets/TagesplanerWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).tagesplaner
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Tagesplaner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: group.$(BUNDLE_ID_PREFIX).tagesplaner
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  TagesplanerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Tagesplaner
      - package: PlannerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tagesplaner.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Tagesplaner:
    build:
      targets:
        Tagesplaner: all
        TagesplanerTests: [test]
    test:
      targets:
        - TagesplanerTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
